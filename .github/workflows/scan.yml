# 布林下轨反转选股 · 按需手动筛选
# ---------------------------------------------------------------------------
# 触发：仅在 GitHub Actions 页面点「Run workflow」时运行（网页「立即筛选」会跳转过来）。
#   不设任何自动定时（schedule 已移除）—— 空仓想找票时手动跑一次即可。
# 推送：不推企业微信；结果只写入 docs/ 静态网页，用 GitHub Pages 公网查看。
# 交易日：手动触发不做交易日阻断，任何时间都能跑；非交易日拿到的是最近收盘快照。
# 缓存：网页把最近一次结果缓存到本机浏览器，关闭/刷新只读缓存，
#   不会重新拉行情、不会重复触发扫描。
# 防重复：concurrency 保证同一时刻只有一个扫描在跑，连点两次不会并发拉数据。
# ---------------------------------------------------------------------------
name: 选股扫描 · 手动触发

on:
  workflow_dispatch:
    inputs:
      source:
        description: '数据源（留空 = akshare；可选 demo / tushare / baostock）'
        required: false
        default: ''
      universe_limit:
        description: '只扫描前 N 只股票（联调用；0 = 全市场）'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: stock-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 恢复历史日线缓存
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/trade_calendar.json
          key: stock-cache-${{ github.run_id }}
          restore-keys: |
            stock-cache-

      - name: 扫描全市场（不推送，结果写入网页）
        env:
          TZ: Asia/Shanghai
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          STOCK_DATA_SOURCE: ${{ inputs.source || 'akshare' }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          UNIVERSE_LIMIT: ${{ inputs.universe_limit || '0' }}
          # 关键：拉不到真实行情时直接失败，绝不降级成演示数据误导决策
          AUTO_FALLBACK_TO_DEMO: 'false'
          MAX_WORKERS: '8'
          HIST_RETRY: '3'
        # main.py scan 默认即不推送企业微信；结果由下一步生成静态网页
        run: python main.py scan

      - name: 生成结果网页（GitHub Pages）
        run: python scripts/render_static.py

      - name: 提交结果与网页
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A   # 首次运行一并纳入解包出的项目源码
          if git diff --staged --quiet; then
            echo "结果无变化，跳过提交"
          else
            git commit -m "选股结果 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') [skip ci]"
            git push
          fi

      - name: 上传结果 JSON
        uses: actions/upload-artifact@v4
        with:
          name: stock-result-${{ github.run_id }}
          path: data/results/latest.json
          retention-days: 14
