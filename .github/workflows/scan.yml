# 布林下轨反转选股 · A 股交易日自动扫描
# ---------------------------------------------------------------------------
# 时间：UTC 06:27 = 北京时间 14:27（周一至周五）
#   刻意避开 :00 / :30 整点高峰，降低 GitHub 排队延迟。
#   注意：GitHub 官方不保证 schedule 准点，高负载时可能延迟 5~20 分钟甚至丢跑。
# 交易日：由 scripts/trading_day_guard.py 查 A 股交易日历，法定节假日自动跳过
#   （cron 本身只能排除周末）。
# 结果：每次运行把 docs/ 静态网页提交回仓库 —— 既可用 GitHub Pages 公网查看，
#   又能产生仓库活动，避免「公开仓库 60 天无活动自动停用定时任务」。
# 密钥：Webhook 必须放 Settings → Secrets → WECOM_WEBHOOK，切勿写进代码或 .env 上传。
# ---------------------------------------------------------------------------
name: 选股扫描 · 交易日 14:27

on:
  schedule:
    - cron: '27 6 * * 1-5'
  workflow_dispatch:
    inputs:
      source:
        description: '数据源（留空 = akshare；可选 demo / tushare / baostock）'
        required: false
        default: ''
      universe_limit:
        description: '只扫描前 N 只股票（联调用；0 = 全市场）'
        required: false
        default: '0'
      no_push:
        description: '填 true 则只跑流程、不推企业微信'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: stock-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

