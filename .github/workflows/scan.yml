      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 判断今天是否 A 股交易日
        id: calendar
        env:
          TZ: Asia/Shanghai
        run: python scripts/trading_day_guard.py

      - name: 恢复历史日线缓存
        if: steps.calendar.outputs.trading == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/trade_calendar.json
          key: stock-cache-${{ github.run_id }}
          restore-keys: |
            stock-cache-

      - name: 扫描全市场并推送 Top10
        if: steps.calendar.outputs.trading == 'true'
        env:
          TZ: Asia/Shanghai
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WECOM_KEYWORD: ${{ vars.WECOM_KEYWORD }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          STOCK_DATA_SOURCE: ${{ inputs.source || 'akshare' }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          UNIVERSE_LIMIT: ${{ inputs.universe_limit || '0' }}
          # 关键：拉不到真实行情时直接失败并告警，绝不降级成演示数据误导决策
          AUTO_FALLBACK_TO_DEMO: 'false'
          MAX_WORKERS: '8'
          HIST_RETRY: '3'
        run: |
          ARGS=""
          if [ "${{ inputs.no_push }}" = "true" ]; then ARGS="--no-push"; fi
          python main.py scan $ARGS

      - name: 生成结果网页（GitHub Pages）
        if: steps.calendar.outputs.trading == 'true'
        run: python scripts/render_static.py

      - name: 提交结果与网页
        if: steps.calendar.outputs.trading == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A   # 首次运行一并纳入解包出的项目源码
          if git diff --staged --quiet; then
            echo "结果无变化，跳过提交"
          else
            git commit -m "选股结果 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') [skip ci]"
            git push
          fi

      - name: 上传结果 JSON
        if: steps.calendar.outputs.trading == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stock-result-${{ github.run_id }}
          path: data/results/latest.json
          retention-days: 14

      - name: 失败告警（避免静默漏跑）
        if: failure()
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WECOM_KEYWORD: ${{ vars.WECOM_KEYWORD }}
        run: |
          if [ -n "$WECOM_WEBHOOK" ]; then
            export MSG="${WECOM_KEYWORD}【选股系统告警】定时任务执行失败，请到 GitHub Actions 查看运行日志"
            python -c 'import json,os; print(json.dumps({"msgtype":"text","text":{"content":os.environ["MSG"]}}, ensure_ascii=False))' \
              | curl -s -X POST "$WECOM_WEBHOOK" -H 'Content-Type: application/json' --data-binary @- || true
          fi
